name: libbpf-bootstrap build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build_libbpf_bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        llvm: [20]
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: Build container (20.04)
        if: ${{ matrix.llvm < 14 }}
        uses: docker/build-push-action@v3
        with:
          push: false
          build-args: |
            LLVM_VERSION=${{ matrix.llvm }}
            VERSION=20.04
            SHORTNAME=focal
          file: ./.github/docker/Dockerfile.ubuntu
          tags: build_container
      - name: Build container (22.04)
        if: ${{ matrix.llvm >= 14 }}
        uses: docker/build-push-action@v3
        with:
          push: false
          build-args: |
            LLVM_VERSION=${{ matrix.llvm }}
            VERSION=22.04
            SHORTNAME=jammy
          file: ./.github/docker/Dockerfile.ubuntu
          tags: build_container
      - name: Build examples/c -- GNU Make
        run: |
          docker run \
            -v $(pwd):/libbpf-bootstrap \
            build_container \
            /bin/bash -c \
            'cd /libbpf-bootstrap/examples/c && make -j`nproc`'
      - name: Build examples/c -- CMake
        run: |
          docker run \
            -v $(pwd):/libbpf-bootstrap \
            build_container \
            /bin/bash -c \
            'cd /libbpf-bootstrap/examples/c && cmake ./ && make'
      - name: Build examples/rust
        run: |
          docker run \
            -v $(pwd):/libbpf-bootstrap \
            build_container \
            /bin/bash -c \
            'cd /libbpf-bootstrap/examples/rust && cargo build'
      - name: Build custom my_tools
        run: |
          docker run \
            -v $(pwd):/libbpf-bootstrap \
            build_container \
            /bin/bash -c \
            'cd /libbpf-bootstrap/my_tools && make -j`nproc`'
