services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    init: true
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9091:9090"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/ready",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    init: true
    environment:
      # 首次部署请通过 .env 或环境变量覆盖默认密码
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 新增 Node Exporter 部分
  node-exporter:
    image: prom/node-exporter:v1.6.0
    container_name: node-exporter
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9100/metrics",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  ebpf-exporter:
    image: ghcr.io/cloudflare/ebpf_exporter:v2.4.2
    container_name: ebpf-exporter
    init: true
    pid: "host"
    volumes:
      - ./ebpf:/examples:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
    cap_add:
      - BPF
      - PERFMON
      - SYS_RESOURCE
    command:
      - "--config.dir=/examples"
      - "--config.names=cpu/irq_stat,disk/disk_read_delay,disk/disk_write_delay,file/read_stat,file/write_stat,memo/mmap_stat,memo/page_fault_stat,memo/page_swap_stat,network/socket_stat,network/tcp_connect"
    ports:
      - "127.0.0.1:9435:9435"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
