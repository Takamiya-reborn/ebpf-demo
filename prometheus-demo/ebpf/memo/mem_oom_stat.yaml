name: mem_oom_stat
metrics:
  counters:
    - name: oom_stats
      help: "Global OOM kill event counter"
      labels:
        - name: idx
          size: 4
          decoders:
            - name: uint32
    - name: oom_victim_map
      help: "Per-PID OOM victim count"
      labels:
        - name: pid
          size: 4
          decoders:
            - name: uint32
