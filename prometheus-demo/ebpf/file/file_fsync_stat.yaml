name: file_fsync_stat
metrics:
  counters:
    - name: fsync_stats
      help: "fsync latency stats. Index: 0=total_latency(ns), 1=count"
      labels:
        - name: op_index
          size: 4
          decoders:
            - name: uint32
    - name: pid_fsync_latency
      help: "Per-PID cumulative fsync latency (ns)"
      labels:
        - name: pid
          size: 4
          decoders:
            - name: uint32
