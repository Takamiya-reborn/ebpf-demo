name: disk_io_sched
metrics:
  counters:
    - name: io_latency_stats
      help: "Block I/O completion latency stats. Index: 0=total_delay(ns), 1=count, 2=max_delay"
      labels:
        - name: op_index
          size: 4
          decoders:
            - name: uint32
    - name: pid_io_latency
      help: "Per-PID cumulative I/O completion latency (ns)"
      labels:
        - name: pid
          size: 4
          decoders:
            - name: uint32
