name: cpu_run_delay
metrics:
  counters:
    - name: run_delay
      help: "Cumulative scheduler run queue delay per PID (ns)"
      labels:
        - name: pid
          size: 4
          decoders:
            - name: uint32
    - name: wakeup_count
      help: "Number of wakeup events per PID"
      labels:
        - name: pid
          size: 4
          decoders:
            - name: uint32
