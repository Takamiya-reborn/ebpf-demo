global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 新增监控任务
  - job_name: 'linux-host'
    static_configs:
      - targets: ['node-exporter:9100']
      
  - job_name: 'ebpf-metrics'
    static_configs:
      - targets: ['ebpf-exporter:9435']